<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123d33">
  <title>Sahaaya — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f8f5;color:#153d33;font-family:Arial,sans-serif}.card{width:min(480px,100%);padding:34px;border:1px solid #d7e2dc;border-radius:20px;background:#fff;box-shadow:0 22px 70px #153d3314}.mark{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:#153d33;color:#fff;font-size:25px}h1{margin:24px 0 10px;font-family:Georgia,serif;font-size:34px;font-weight:500}p{color:#60726a;line-height:1.6}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#176b55;color:#fff;font:800 15px Arial;cursor:pointer}.emergency{margin-top:22px;padding-top:18px;border-top:1px solid #e2e8e4;font-size:12px;color:#8a4a39}
  </style>
</head>
<body><main class="card"><div class="mark">✦</div><h1>You’re offline</h1><p>Sahaaya cannot reach the live community network right now. Reconnect to see current requests, offers, locations, and delivery updates.</p><button onclick="location.reload()">Try again</button><p class="emergency">For a life-threatening emergency, contact your local emergency services directly.</p></main></body>
</html>
