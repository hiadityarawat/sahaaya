name: Test, build, and deploy API
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, id-token: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE }}", aws-region: ap-south-1 }
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - run: docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" ./server
        env: { ECR_REGISTRY: "${{ steps.login.outputs.registry }}", ECR_REPOSITORY: "${{ vars.ECR_REPOSITORY }}" }
      - run: docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
        env: { ECR_REGISTRY: "${{ steps.login.outputs.registry }}", ECR_REPOSITORY: "${{ vars.ECR_REPOSITORY }}" }
      - run: aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" --force-new-deployment
